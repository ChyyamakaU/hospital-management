# Render blueprint for the backend.
#
# This is a declaration, not a deployment: nothing is created until someone
# clicks "Apply" in Render (or runs `render blueprint launch`). It documents
# every setting the backend needs in one file so the setup is repeatable.
#
# See README.md -> Deployment for the manual dashboard equivalent.

services:
  - type: web
    name: hospital-management-api
    runtime: node
    rootDir: backend
    plan: free
    # Generate the Prisma client and apply migrations during the build, so a
    # released build always matches the committed schema.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Render generates a long random secret for us.
      - key: JWT_SECRET
        generateValue: true
      # Fill this in with the Vercel URL after the frontend is deployed.
      # Comma separate several origins: https://a.vercel.app,https://b.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-management-db
          property: connectionString

databases:
  - name: hospital-management-db
    databaseName: hospital_management
    user: hospital
    # Free plan databases expire after 30 days; bump the plan for real use.
    plan: free
